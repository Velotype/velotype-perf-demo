<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velotype performance demo</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<meta name="description" content="The same dashboard in Velotype, React, and plain DOM code, timed in your own browser.">
<style>
    /* The colors come from theme.css, the velodesign theme. These names are what the rules below use */
    :root {
        --bg: var(--background);
        --surface: var(--background-1);
        --fg: var(--text);
        --muted: color-mix(in srgb, var(--text) 65%, var(--background));
        --line: var(--background-4);
        --highlight: var(--primary-7);
        --accent-soft: var(--primary-3);
        --warn: var(--warning-8);
        --warn-bg: var(--warning-3);
        --code-bg: var(--background-2);
        --card-pad: 20px;
    }
    :root[data-theme="light"] {
        --series-0: #3b6fe0;
        --series-1: #7c3aed;
        --series-2: #ca8a04;
        --series-3: #ea580c;
        --series-4: #16a34a;
        --series-5: #0891b2;
        --series-6: #db2777;
        --series-7: #dc2626;
        --series-8: #6b7280;
        --series-9: #a16207;
        --bar-text: #ffffff;
    }
    :root[data-theme="dark"] {
        --series-0: #7aa2ff;
        --series-1: #a78bfa;
        --series-2: #facc15;
        --series-3: #fb923c;
        --series-4: #4ade80;
        --series-5: #22d3ee;
        --series-6: #f472b6;
        --series-7: #f87171;
        --series-8: #9ca3af;
        --series-9: #d6b370;
        --bar-text: #0f1216;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; transition: color 0.25s ease-in-out, background-color 0.25s ease-in-out; }
    a { color: var(--fg); }
    code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.2rem; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 0.82em; overflow-wrap: anywhere; }

    .site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--background-4); }
    .site-nav .brand { display: inline-flex; align-items: center; gap: 0.5em; margin-inline-end: auto; font-weight: bold; text-decoration: none; }
    .site-nav .brand img { width: 1.75em; height: 1.75em; border-radius: 0.2em; }
    .site-nav .links { display: flex; flex-wrap: wrap; gap: 16px; }
    .page { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
    .intro p { max-width: 70ch; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; padding: var(--card-pad); min-width: 0; overflow: hidden; }
    /* Like velodesign's Card, the first heading of a card is a band across its top */
    .card > h2:first-child, .card > .card-head:first-child { margin: calc(-1 * var(--card-pad)) calc(-1 * var(--card-pad)) var(--card-pad); padding: 0.75em 1em; background: var(--background-2); border-bottom: 1px solid var(--line); }
    .card > h2:first-child { font-size: 1em; }
    .card > .card-head:first-child h2 { font-size: 1em; }
    .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .card-head h2 { margin: 0; }

    .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; margin-bottom: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.9em; }
    .field.inline { flex-direction: row; align-items: center; gap: 8px; }
    .field > span, .field > legend { color: var(--muted); }
    fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
    fieldset.field > legend { padding: 0; margin-bottom: 4px; }
    .checks { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .check { display: flex; align-items: center; gap: 6px; }
    select, .button, .tab {
        font: inherit;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        padding: 0.25rem 0.5rem;
        transition: color 0.25s ease-in-out, background-color 0.25s ease-in-out, border 0.25s ease-in-out;
    }
    .button, .tab { cursor: pointer; }
    .button:hover, .tab:hover { background: var(--background-2); }
    .button.primary { background: var(--primary); border-color: var(--primary-5); color: var(--text); }
    .button.primary:hover { background: var(--primary-2); border-color: var(--primary-7); }
    .button.warning { background: var(--warning); border-color: var(--warning-5); color: var(--text); }
    .button.warning:hover { background: var(--warning-2); border-color: var(--warning-7); }
    .status { display: flex; flex-direction: column; gap: 4px; min-height: 2.8em; margin-bottom: 8px; }
    progress { width: 100%; height: 8px; accent-color: var(--primary); }
    .progress-row { display: grid; grid-template-columns: 11em minmax(0, 1fr) minmax(0, 16em); align-items: center; gap: 12px; font-size: 0.88em; }
    .progress-label { font-variant-numeric: tabular-nums; }
    .progress-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 640px) {
        .progress-row { grid-template-columns: 1fr; gap: 2px; }
    }

    .stage { display: block; width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

    .results { display: flex; flex-direction: column; gap: 20px; }
    .alert { background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warning-6); border-left-width: 4px; border-radius: 0.25rem; padding: 12px 16px; }
    .alert ul { margin: 8px 0 0; padding-left: 1.2em; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.9em; }
    .end { text-align: right; }
    td { font-variant-numeric: tabular-nums; }
    .detail { font-size: 0.82em; color: var(--muted); max-width: 42ch; }
    .cell { display: grid; justify-items: end; gap: 2px; min-width: 7em; }
    .cell .ms { font-weight: 600; }
    .cell .relative { font-size: 0.8em; color: var(--muted); }
    .cell.fastest .relative, .fastest { color: var(--highlight); font-weight: 600; }
    .meter { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--highlight); }
    .cell.slow .ms { color: var(--warn); }
    .cell.slow .meter > span { background: var(--warn); }
    .chart-bar.slow { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(0, 0, 0, 0.25) 4px 8px); }
    .mean td { border-bottom: 0; }
    .tag { display: inline-block; margin-left: 8px; padding: 0.1em 0.6em; border-radius: 0.25rem; font-size: 0.85em; line-height: 1.6; color: var(--text); background: var(--primary-3); border: 1px solid var(--primary-6); white-space: nowrap; }

    .chart { margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .chart.by-action { margin-top: 10px; }
    .chart-group { display: grid; grid-template-columns: minmax(8em, 11em) 1fr; column-gap: 12px; align-items: center; }
    .chart-label { grid-row: span 10; font-size: 0.9em; }
    .chart-row { display: flex; align-items: center; height: 20px; min-width: 0; }
    /* Each bar is a container, so that its name can move outside it when the bar is too short to hold it */
    .chart-bar { position: relative; display: block; flex: none; height: 18px; border-radius: 3px; container-type: inline-size; font-size: 12px; }
    .bar-name { position: absolute; left: 7px; top: 0; line-height: 18px; font-weight: 600; color: var(--bar-text); white-space: nowrap; }
    .chart-value { position: absolute; left: calc(100% + 8px); top: 0; line-height: 18px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .value-name { display: none; color: var(--fg); }
    @container (max-width: 125px) {
        .bar-name { display: none; }
        .value-name { display: inline; }
    }
    .chart-note { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .series-0 { background: var(--series-0); }
    .series-1 { background: var(--series-1); }
    .series-2 { background: var(--series-2); }
    .series-3 { background: var(--series-3); }
    .series-4 { background: var(--series-4); }
    .series-5 { background: var(--series-5); }
    .series-6 { background: var(--series-6); }
    .series-7 { background: var(--series-7); }
    .series-8 { background: var(--series-8); }
    .series-9 { background: var(--series-9); }

    .samples { margin-top: 16px; }
    .samples summary { cursor: pointer; }
    .share { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0 8px; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tab.active { background: var(--primary-3); border-color: var(--primary-6); }
    .code { margin: 0; max-height: 560px; overflow: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 12px; font-size: 0.82em; line-height: 1.5; }
    .notes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }

    @media (max-width: 640px) {
        .stage { height: 440px; }
        :root { --card-pad: 16px; }
        .chart-group { grid-template-columns: 1fr; }
        .chart-label { grid-row: auto; }
    }
</style>
</head>
<body>
<nav class="site-nav" aria-label="The Velocity Project">
    <a class="brand" href="https://velotype.github.io/"><img src="logo.svg" alt="" width="28" height="28">The Velocity Project</a>
    <div class="links">
        <a href="https://velotype.github.io/docs/velotype/">Docs</a>
        <a href="https://github.com/Velotype">GitHub</a>
        <a href="https://jsr.io/@velotype">JSR</a>
        <a href="https://argoday.medium.com/">Articles</a>
    </div>
</nav>
<div id="app"></div>
<script type="module" src="harness.js"></script>
</body>
</html>
